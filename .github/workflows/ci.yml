name: CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type checks, tests and builds
        run: npm run check
      - name: Known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Main flows in a real browser, against the local demo
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-traces
          path: test-results/
          retention-days: 7
