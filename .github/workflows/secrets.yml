name: Create Worker secrets

# Makes the secrets both Workers share and saves them straight into Cloudflare, without a computer.
# From a phone: GitHub app → this repository → Actions → Create Worker secrets → Run workflow.
#
# Sets on zorion-app and zorion-site:
#   PEPPER     random, made here (keys passwords, codes and session tokens)
#   TOTP_KEY   random, made here (encrypts authenticator keys)
#   DATABASE_URL  copied from this repository's DATABASE_URL secret
# and on zorion-app only:
#   TELEGRAM_WEBHOOK_SECRET  random, made here (only used once a Telegram bot is set up)
# Nothing is printed: the values go from this run straight to Cloudflare.
#
# Needs, under Settings → Secrets and variables → Actions:
#   secret CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template)
#   secret CLOUDFLARE_ACCOUNT_ID  (Cloudflare → Workers & Pages → Account details)
#   secret DATABASE_URL
#
# It refuses to replace PEPPER or TOTP_KEY once they exist: a new PEPPER signs everyone out and breaks every
# password and guest code, and a new TOTP_KEY breaks every authenticator. Tick "replace" only on purpose.
on:
  workflow_dispatch:
    inputs:
      replace:
        description: Replace PEPPER and TOTP_KEY even if they exist (signs everyone out; breaks passwords and authenticators)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: worker-secrets
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REPLACE: ${{ inputs.replace }}
    steps:
      - name: Check settings
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$DATABASE_URL" ] || missing="$missing DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Add these secrets under Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the Workers exist and what is already set
        run: |
          for worker in zorion-app zorion-site; do
            if ! npx wrangler secret list --name "$worker" --format json > "/tmp/$worker.json" 2> "/tmp/$worker.err"; then
              echo "::error::Could not read $worker. Create it first (docs/DEPLOYMENT.md, section 4), then run this again."
              cat "/tmp/$worker.err" | grep -v -i token || true
              exit 1
            fi
          done
          has() { node -e "process.exit(require('/tmp/$1.json').some((s) => s.name === '$2') ? 0 : 1)"; }
          existing=""
          for worker in zorion-app zorion-site; do
            for name in PEPPER TOTP_KEY; do
              if has "$worker" "$name"; then existing="$existing $worker/$name"; fi
            done
          done
          if [ -n "$existing" ] && [ "$REPLACE" != "true" ]; then
            echo "::error::Already set:$existing. Leaving everything as it is. Tick 'replace' only if you mean to sign everyone out."
            exit 1
          fi

      - name: Make and save the secrets
        run: |
          pepper=$(openssl rand -hex 32)
          totp=$(openssl rand -base64 32)
          telegram=$(openssl rand -hex 32)
          echo "::add-mask::$pepper"
          echo "::add-mask::$totp"
          echo "::add-mask::$telegram"
          put() { printf '%s' "$3" | npx wrangler secret put "$2" --name "$1" > /dev/null; echo "set $2 on $1"; }
          for worker in zorion-app zorion-site; do
            put "$worker" PEPPER "$pepper"
            put "$worker" TOTP_KEY "$totp"
            put "$worker" DATABASE_URL "$DATABASE_URL"
          done
          put zorion-app TELEGRAM_WEBHOOK_SECRET "$telegram"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Worker secrets"
            echo "- PEPPER, TOTP_KEY and DATABASE_URL on zorion-app and zorion-site; TELEGRAM_WEBHOOK_SECRET on zorion-app"
            echo "- Replace: $REPLACE"
            echo "- Result: ${{ job.status }}"
            echo "- Values are never shown. Both Workers pick them up on their next request."
          } >> "$GITHUB_STEP_SUMMARY"
