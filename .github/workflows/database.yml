name: Deploy database

# Applies new database migrations to Neon, without a computer.
# From a phone: GitHub app → this repository → Actions → Deploy database → Run workflow.
#
# Needs, under Settings → Secrets and variables → Actions:
#   secret   DATABASE_URL   (Neon → the project → Connect → the connection string)
# Optional: variable AUTO_DEPLOY_DATABASE = true runs this automatically after CI passes on main.
#
# It refuses to deploy a commit whose CI run did not pass, so untested migrations never reach the database.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the migrations that would run (changes nothing)
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: database-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs always; automatic runs only when switched on and CI passed on a push to this repository's main
    # (never a pull request's run, and never a fork's).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY_DATABASE == 'true' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check settings
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the secret DATABASE_URL under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Make sure CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub can take a little while to list a run that has just finished, so ask a few times.
          for attempt in 1 2 3 4 5 6; do
            result=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // "none"' || echo "error")
            [ "$result" = "success" ] && break
            [ "$result" = "failure" ] || [ "$result" = "cancelled" ] && break
            sleep 15
          done
          if [ "$result" != "success" ]; then
            echo "::error::CI has not passed for ${SHA::7} (result: $result). Wait for CI to finish, or fix it, then run this again."
            exit 1
          fi
          echo "::notice::CI passed for ${SHA::7}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrations that would run
        run: npm run migrate -- --dry-run

      - name: Apply migrations
        if: env.DRY_RUN != 'true'
        run: npm run migrate

      - name: Summary
        if: always()
        run: |
          {
            echo "### Database deploy"
            echo "- Commit: \`${SHA::7}\`"
            echo "- Dry run: $DRY_RUN"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
